version: '3'

services:
  odoo-18:
    image: odoo-software
    container_name: odoo
    volumes:
      - odooappdata:/var/lib/odoo
      - ./extra-odoo-addons:/mnt/extra-addons
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
      - PGHOST=db
      - PGUSER=odoo
      - PGPASSWORD=odoo

  db:
    image: postgres:16
    container_name: postgres
    ports:
      - '5434:5432'
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    volumes:
      - './odoo-db-dump:/resources/db-dump'
      - 'odoodbdata:/var/lib/postgresql/data'

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=securepassword
      - N8N_HOST=n8n.local
      - N8N_PORT=5678
      - NODE_ENV=production
    restart: always        

volumes:
  odooappdata:
  odoodbdata:
